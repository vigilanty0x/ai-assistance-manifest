[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-provenance-badge"
version = "0.1.0"
description = "Validate machine-readable AI assistance, supervision, tests, and evidence."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
ai-project-provenance-badge = "ai_project_provenance_badge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

